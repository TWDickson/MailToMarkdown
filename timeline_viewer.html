<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Timeline Viewer</title>
    <style>
        * {

            box-sizing: border-box;
        }

        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }

        .container {

            margin: 0 auto;
            background: white;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;

        .header h1 {

        }

        .thread-line-svg {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }
        
        .connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .timeline {
            position: relative;
            padding: 20px 0 20px 0;
            min-height: 600px;
            margin-left: 280px;
        }
        
        .day-spacer {
            height: 30px;
        }

        .date-marker {

            left: -280px;

            padding-right: 20px;

        .date-label {

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Timeline Viewer</h1>
            <p>Visualize your email conversations as an interactive timeline</p>
        </div>

        <div class="controls">
            <div class="file-input-wrapper">
                <label for="folder-input" class="btn">
                    📂 Load Export Folder
                </label>
                <input type="file" id="folder-input" webkitdirectory directory multiple>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <strong>Emails:</strong> <span id="email-count">0</span>
                </div>
                <div class="stat-item">
                    <strong>Threads:</strong> <span id="thread-count">0</span>
                </div>
                <div class="stat-item">
                    <strong>Attachments:</strong> <span id="attachment-count">0</span>
                </div>
            </div>
        </div>

        <div class="timeline-container">
            <div id="timeline-content">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>No Emails Loaded</h3>
                    <p>Click "Load Export Folder" above to visualize your email timeline</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Email Modal -->
    <div id="email-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 id="modal-subject">Email Subject</h2>
                <div class="meta" id="modal-meta">
                    <div id="modal-date"></div>
                </div>
            </div>
            <div class="modal-body">
                <div class="email-metadata" id="modal-metadata"></div>
                <div class="email-body" id="modal-body"></div>
                <div class="attachments-section" id="modal-attachments" style="display: none;">
                    <h3>📎 Attachments</h3>
                    <div class="attachment-list" id="attachment-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let emails = [];
        let threads = {};
        let attachmentFiles = {}; // Store actual attachment file objects

        // Parse frontmatter from markdown
        function parseFrontmatter(content) {
            // Normalize line endings to \n
            const normalized = content.replace(/\r\n/g, '\n');

            // Match frontmatter block
            const frontmatterRegex = /^---\n([\s\S]*?)\n---\n([\s\S]*)$/;
            const match = normalized.match(frontmatterRegex);

            if (!match) {
                console.warn('No frontmatter match found. Content preview:', content.substring(0, 100));
                return null;
            }

            const frontmatter = {};
            const lines = match[1].split('\n');
            let currentKey = null;
            let currentValue = [];

            lines.forEach(line => {
                // Match key-value pairs (including those with quotes and special characters)
                const keyMatch = line.match(/^([a-z_]+):\s*(.*)$/);
                if (keyMatch) {
                    // Save previous key-value if exists
                    if (currentKey) {
                        frontmatter[currentKey] = currentValue.join('\n').trim();
                    }
                    currentKey = keyMatch[1];
                    currentValue = [keyMatch[2]];
                } else if (currentKey && line.trim()) {
                    // This is a continuation line (like multi-line attachments)
                    currentValue.push(line.trim());
                }
            });

            // Save the last key-value pair
            if (currentKey) {
                frontmatter[currentKey] = currentValue.join('\n').trim();
            }

            // Parse attachments if present
            if (frontmatter.attachments) {
                const attachmentLines = frontmatter.attachments.split('\n');
                frontmatter.attachments = attachmentLines
                    .filter(line => line.trim() && line.trim() !== '-' && line.trim() !== 'None')
                    .map(line => {
                        // Match [filename](path) format
                        const match = line.match(/- \[(.*?)\]\((.*?)\)/);
                        if (match) {
                            return { name: match[1], path: match[2] };
                        }
                        return null;
                    })
                    .filter(att => att !== null);
            }

            console.log('Parsed frontmatter keys:', Object.keys(frontmatter));

            return {
                metadata: frontmatter,
                body: match[2].trim()
            };
        }

        // Load emails from files
        async function loadEmails(files) {
            const timeline = document.getElementById('timeline-content');
            timeline.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading emails...</p></div>';

            emails = [];
            attachmentFiles = {};
            const allFiles = Array.from(files);
            console.log(`Total files selected: ${allFiles.length}`);

            // Separate markdown files from attachments
            const markdownFiles = [];
            const attachments = [];

            allFiles.forEach(f => {
                if (f.name.endsWith('.md')) {
                    // Only include .md files that are in the root of export folder
                    const isInRootOrExport = !f.webkitRelativePath.includes('/attachments/') &&
                                            !f.webkitRelativePath.includes('\\attachments\\');
                    if (isInRootOrExport) {
                        markdownFiles.push(f);
                    }
                } else {
                    // Store attachment files for later reference
                    const pathParts = f.webkitRelativePath.split(/[/\\]/);
                    const filename = pathParts[pathParts.length - 1];
                    attachmentFiles[filename] = f;
                    attachments.push(f);
                }
            });

            console.log(`Markdown files found: ${markdownFiles.length}`);
            console.log(`Attachment files found: ${attachments.length}`);

            if (markdownFiles.length === 0) {
                let errorMsg = '<div class="error">';
                errorMsg += '<h3>No valid email files found</h3>';
                errorMsg += `<p>Selected ${allFiles.length} total files, but found 0 .md email files.</p>`;
                errorMsg += '<p><strong>Tips:</strong></p>';
                errorMsg += '<ul style="text-align: left; margin: 10px 0;">';
                errorMsg += '<li>Make sure you selected the folder containing your exported .md files</li>';
                errorMsg += '<li>The .md files should be in the root of the export folder, not in subdirectories</li>';
                errorMsg += '<li>Check that your export completed successfully and created .md files</li>';
                errorMsg += '</ul>';
                errorMsg += '</div>';
                timeline.innerHTML = errorMsg;
                return;
            }

            for (const file of markdownFiles) {
                try {
                    const content = await file.text();
                    console.log(`Processing ${file.name}, content length: ${content.length}, first 50 chars:`, content.substring(0, 50));
                    const parsed = parseFrontmatter(content);

                    if (parsed) {
                        console.log(`✓ Successfully parsed ${file.name}`);
                        emails.push({
                            ...parsed.metadata,
                            body: parsed.body,
                            filename: file.name
                        });
                    } else {
                        console.warn(`✗ Could not parse frontmatter from ${file.name}`);
                    }
                } catch (error) {
                    console.error(`✗ Error parsing ${file.name}:`, error);
                }
            }

            if (emails.length === 0) {
                let errorMsg = '<div class="error">';
                errorMsg += '<h3>Parsing Error</h3>';
                errorMsg += `<p>Found ${markdownFiles.length} .md files but could not parse any valid email data.</p>`;
                errorMsg += '<div class="debug-info">';
                errorMsg += '<p><strong>Debug Information:</strong></p>';
                errorMsg += '<p>Check the browser console (F12) for detailed parsing errors.</p>';
                errorMsg += '<p>The frontmatter should start with <code>---</code> and end with <code>---</code>.</p>';
                errorMsg += '<p>Example format:</p>';
                errorMsg += '<pre style="text-align: left; background: #f8f9fa; padding: 10px; border-radius: 4px;">---\nfrom: sender@example.com\nto: recipient@example.com\ndate: 2025-01-01T12:00:00+0000\nsubject: Test Email\n---\n\nEmail body here...</pre>';
                errorMsg += '</div>';
                errorMsg += '</div>';
                timeline.innerHTML = errorMsg;
                return;
            }

            console.log(`Successfully loaded ${emails.length} emails`);

            // Sort emails by date
            emails.sort((a, b) => {
                const dateA = new Date(a.date || 0);
                const dateB = new Date(b.date || 0);
                return dateA - dateB;
            });

            // Build thread structure
            buildThreads();

            // Render timeline
            renderTimeline();

            // Update stats
            updateStats();
        }

        // Build thread relationships
        function buildThreads() {
            threads = {};
            
            emails.forEach((email, index) => {
                email.index = index; // Store original index
                const messageId = email.message_id;
                const inReplyTo = email.in_reply_to;
                
                if (!threads[messageId]) {
                    threads[messageId] = {
                        email: email,
                        replies: [],
                        thread_root: null,
                        thread_color: null
                    };
                }
                
                if (inReplyTo && threads[inReplyTo]) {
                    threads[inReplyTo].replies.push(messageId);
                    threads[messageId].thread_root = inReplyTo;
                }
            });
            
            // Assign thread colors - all emails in a thread get the same color
            const colors = ['#667eea', '#f093fb', '#4facfe', '#43e97b', '#fa709a', '#30cfd0', '#a8edea', '#fed6e3'];
            let colorIndex = 0;
            const assignedColors = new Map(); // message_id -> color
            
            // Find root of each thread and assign colors
            function getRootAndAssignColor(messageId, visitedSet = new Set()) {
                if (visitedSet.has(messageId)) return null; // Prevent infinite loops
                visitedSet.add(messageId);
                
                // If we already assigned a color to this message, return it
                if (assignedColors.has(messageId)) {
                    return assignedColors.get(messageId);
                }
                
                const thread = threads[messageId];
                if (!thread) return null;
                
                // If this is a root (no parent), assign new color
                if (!thread.thread_root) {
                    const color = colors[colorIndex % colors.length];
                    colorIndex++;
                    assignedColors.set(messageId, color);
                    return color;
                }
                
                // Otherwise, get parent's color
                const parentColor = getRootAndAssignColor(thread.thread_root, visitedSet);
                if (parentColor) {
                    assignedColors.set(messageId, parentColor);
                }
                return parentColor;
            }
            
            // Assign colors to all emails
            emails.forEach(email => {
                const color = getRootAndAssignColor(email.message_id);
                email.thread_color = color || '#667eea';
                
                // Also set thread subject for grouping
                const normalizedSubject = (email.subject || '').replace(/^(Re:|Fwd:|RE:|FWD:)\s*/gi, '').trim();
                email.thread_subject = normalizedSubject;
            });
        }

        // Render timeline with git-style tree branching
        function renderTimeline() {
            if (emails.length === 0) return;
            
            const timeline = document.getElementById('timeline-content');
            let html = '<div class="timeline"><div class="timeline-line"></div>';
            
            // Build parent-child relationships for thread tracking
            const emailById = new Map();
            const emailPositions = new Map(); // Track Y position of each email
            
            emails.forEach((email, index) => {
                emailById.set(email.message_id, {
                    ...email,
                    index: index,
                    children: []
                });
            });
            
            // Link parents to children
            emails.forEach(email => {
                if (email.in_reply_to && emailById.has(email.in_reply_to)) {
                    const parent = emailById.get(email.in_reply_to);
                    parent.children.push(email.message_id);
                }
            });
            
            // Track connections for SVG layer
            const connectionData = [];
            
            let yPosition = 0;
            const itemHeight = 140;
            let lastDate = null;
            
            // Render emails in CHRONOLOGICAL order
            emails.forEach((email, index) => {
                const currentYPos = yPosition;
                emailPositions.set(email.message_id, currentYPos);
                
                const date = new Date(email.date);
                const dateKey = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                const timeStr = date.toLocaleString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Determine if this is a reply and should be indented
                let depth = 0;
                let shouldShowConnection = false;
                
                if (email.in_reply_to && emailById.has(email.in_reply_to)) {
                    const parent = emailById.get(email.in_reply_to);
                    const parentYPos = emailPositions.get(email.in_reply_to);
                    
                    // Only indent if parent has multiple children (branching)
                    if (parent.children.length > 1) {
                        depth = 1;
                        shouldShowConnection = true;
                    }
                    
                    // Store connection data if we're showing it
                    if (shouldShowConnection && parentYPos !== undefined) {
                        connectionData.push({
                            parentYPos,
                            currentYPos,
                            depth,
                            color: email.thread_color || '#667eea'
                        });
                    }
                }
                
                const horizontalOffset = 20 + (depth * 60);
                const connectorWidth = horizontalOffset - 4;
                
                // Add date marker when date changes
                if (dateKey !== lastDate) {
                    html += `
                        <div class="date-marker" style="top: ${yPosition}px;">
                            <div class="date-label">
                                <span class="date-text">${dateKey}</span>
                            </div>
                        </div>
                    `;
                    lastDate = dateKey;
                }
                
                const isReply = email.in_reply_to ? 'thread-reply' : 'thread-start';
                const isSent = email.folder === 'Sent' ? 'sent' : 'received';
                const attachmentCount = email.attachments ? email.attachments.length : 0;
                const preview = email.body.substring(0, 100).replace(/\n/g, ' ');
                
                // Connector line (horizontal from dot to card)
                const lineHtml = `<div class="thread-connector" style="
                    width: ${connectorWidth}px;
                    background-color: ${email.thread_color || '#667eea'};
                "></div>`;
                
                html += `
                    <div class="timeline-item" style="margin-left: ${horizontalOffset}px;" onclick="showEmail(${index})">
                        ${lineHtml}
                        <div class="email-dot" style="background-color: ${email.thread_color || '#667eea'};"></div>
                        <div class="email-card ${isReply} ${isSent}" style="border-left-color: ${email.thread_color || '#667eea'};">
                            <div class="card-time">${timeStr}</div>
                            <div class="subject">${email.subject || 'No Subject'}</div>
                            <div class="from">${email.from || 'Unknown'}</div>
                            ${email.to ? `<div class="to">→ ${email.to}</div>` : ''}
                            <div class="preview">${preview}...</div>
                            <div class="tags">
                                <span class="tag folder">${email.folder || 'INBOX'}</span>
                                ${attachmentCount > 0 ? `<span class="tag attachments">📎 ${attachmentCount}</span>` : ''}
                                ${email.in_reply_to ? '<span class="tag reply">↩️ Reply</span>' : '<span class="tag new">✨ New Thread</span>'}
                            </div>
                        </div>
                    </div>
                `;
                
                yPosition += itemHeight;
            });
            
            // Build SVG connections layer
            let svgConnectionsHtml = '<div class="connections-layer">';
            connectionData.forEach(conn => {
                const verticalHeight = conn.currentYPos - conn.parentYPos - 40;
                const parentLeft = 19; // Start from timeline
                const childLeft = 20 + (conn.depth * 60) - 1;
                const curveSize = 20;
                
                if (verticalHeight > 5) {
                    const svgHeight = verticalHeight + curveSize + 20;
                    // Draw from parent dot down and curve to child
                    const path = `M ${parentLeft} 0 L ${parentLeft} ${verticalHeight} Q ${parentLeft} ${verticalHeight + curveSize}, ${childLeft} ${verticalHeight + curveSize + 15}`;
                    
                    svgConnectionsHtml += `
                        <svg class="thread-line-svg" style="left: 0; top: ${conn.parentYPos + 40}px; width: ${childLeft + 10}px; height: ${svgHeight}px;">
                            <path d="${path}" stroke="${conn.color}" 
                                  stroke-width="2" fill="none" opacity="0.5" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    `;
                }
            });
            svgConnectionsHtml += '</div>';
            
            html += '</div>';
            timeline.innerHTML = svgConnectionsHtml + html;
        }        // Show email in modal
        function showEmail(index) {
            const email = emails[index];
            const modal = document.getElementById('email-modal');

            document.getElementById('modal-subject').textContent = email.subject || 'No Subject';

            const date = new Date(email.date);
            const formattedDate = date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('modal-date').textContent = formattedDate;

            // Metadata
            let metadataHtml = `
                <div class="metadata-row">
                    <div class="metadata-label">From:</div>
                    <div class="metadata-value">${email.from || 'Unknown'}</div>
                </div>
                <div class="metadata-row">
                    <div class="metadata-label">To:</div>
                    <div class="metadata-value">${email.to || 'Unknown'}</div>
                </div>
            `;

            if (email.cc) {
                metadataHtml += `
                    <div class="metadata-row">
                        <div class="metadata-label">CC:</div>
                        <div class="metadata-value">${email.cc}</div>
                    </div>
                `;
            }

            if (email.bcc) {
                metadataHtml += `
                    <div class="metadata-row">
                        <div class="metadata-label">BCC:</div>
                        <div class="metadata-value">${email.bcc}</div>
                    </div>
                `;
            }

            metadataHtml += `
                <div class="metadata-row">
                    <div class="metadata-label">Folder:</div>
                    <div class="metadata-value">${email.folder || 'INBOX'}</div>
                </div>
            `;

            if (email.in_reply_to) {
                metadataHtml += `
                    <div class="metadata-row">
                        <div class="metadata-label">In Reply To:</div>
                        <div class="metadata-value" style="font-size: 11px; font-family: monospace;">${email.in_reply_to}</div>
                    </div>
                `;
            }

            document.getElementById('modal-metadata').innerHTML = metadataHtml;

            // Body - convert markdown links to HTML
            const bodyHtml = email.body.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            document.getElementById('modal-body').innerHTML = bodyHtml;

            // Attachments
            const attachmentsSection = document.getElementById('modal-attachments');
            const attachmentList = document.getElementById('attachment-list');

            if (email.attachments && email.attachments.length > 0) {
                attachmentsSection.style.display = 'block';

                // Generate attachment items with download capability
                attachmentList.innerHTML = email.attachments.map(att => {
                    const file = attachmentFiles[att.name];

                    if (file) {
                        // File exists - create downloadable link
                        const fileSize = (file.size / 1024).toFixed(1) + ' KB';
                        return `
                            <div class="attachment-item clickable" data-filename="${att.name}">
                                <span class="attachment-icon">📎</span>
                                <span>${att.name}</span>
                                <span style="color: #888; font-size: 12px; margin-left: 8px;">(${fileSize})</span>
                                <span style="margin-left: auto; color: #667eea;">⬇ Download</span>
                            </div>
                        `;
                    } else {
                        // File not found in selected folder
                        return `
                            <div class="attachment-item">
                                <span class="attachment-icon">📎</span>
                                <span>${att.name}</span>
                                <span style="color: #888; font-size: 12px; margin-left: 8px;">(not loaded)</span>
                            </div>
                        `;
                    }
                }).join('');

                // Add click handlers for downloadable attachments
                document.querySelectorAll('.attachment-item.clickable').forEach(item => {
                    item.addEventListener('click', function() {
                        const filename = this.dataset.filename;
                        const file = attachmentFiles[filename];

                        if (file) {
                            // Create blob URL and trigger download
                            const url = URL.createObjectURL(file);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }
                    });
                });
            } else {
                attachmentsSection.style.display = 'none';
            }

            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('email-modal').classList.remove('active');
        }

        // Update statistics
        function updateStats() {
            document.getElementById('email-count').textContent = emails.length;

            // Count unique threads (emails without in_reply_to)
            const rootThreads = emails.filter(e => !e.in_reply_to).length;
            document.getElementById('thread-count').textContent = rootThreads;

            // Count total attachments
            const totalAttachments = emails.reduce((sum, e) => {
                return sum + (e.attachments ? e.attachments.length : 0);
            }, 0);
            document.getElementById('attachment-count').textContent = totalAttachments;
        }

        // File input handler
        document.getElementById('folder-input').addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                loadEmails(files);
            }
        });

        // Close modal on background click
        document.getElementById('email-modal').addEventListener('click', (e) => {
            if (e.target.id === 'email-modal') {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
